name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / doc / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --check

      # `--locked` on the FIRST cargo command, not just on the build. Without it,
      # clippy resolves dependencies and rewrites Cargo.lock in the workspace, so
      # a later `--locked` step sees the repaired file and passes — which is how a
      # release commit whose committed lockfile was a version behind went green
      # here and then failed the Release workflow, whose first cargo command IS
      # `--locked`.
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps

      - name: Build
        run: cargo build --locked --release

      - name: Test
        run: cargo test --locked
